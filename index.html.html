<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《消費結帳王》兩關挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f7f3e9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Game Container */
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 1024px;
            max-height: 768px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #e2b13c;
        }

        /* Top Header */
        header {
            background: linear-gradient(135deg, #e25b8a, #d81b60);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-indicator {
            display: flex;
            gap: 10px;
        }

        .step-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            transition: all 0.3s;
        }

        .step-dot.active {
            background: #ffeb3b;
            color: #333;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(255,235,59,0.8);
        }

        /* Main Game Screen */
        .stage {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            position: relative;
            background: #fffdf8;
            overflow-y: auto;
        }

        .stage.active {
            display: flex;
        }

        /* Character & Dialogue Bar */
        .lanmei-dialogue {
            display: flex;
            align-items: center;
            background: #fff0f5;
            border: 3px solid #f8bbd0;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 20px;
            gap: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .lanmei-avatar {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.15));
            flex-shrink: 0;
        }

        .dialogue-text {
            font-size: 20px;
            line-height: 1.5;
            color: #4a148c;
            font-weight: bold;
        }

        .scenario-box {
            background: #e3f2fd;
            border-left: 6px solid #2196f3;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 20px;
            color: #0d47a1;
            font-weight: 600;
        }

        /* STAGE 1: Drag & Drop */
        .s1-area {
            flex: 1;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: space-around;
            background: #fdfae7;
            border-radius: 16px;
            border: 2px dashed #d4ac0d;
            padding: 20px;
            position: relative;
        }

        .barcode-item {
            width: 220px;
            height: 110px;
            background: white;
            border: 3px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            transition: transform 0.1s;
            touch-action: none;
            z-index: 10;
        }

        .barcode-item:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .barcode-lines {
            width: 80%;
            height: 45px;
            background: repeating-linear-gradient(
                90deg,
                #000,
                #000 3px,
                #fff 3px,
                #fff 7px
            );
            margin-bottom: 5px;
        }

        .barcode-label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .scanner-zone {
            width: 260px;
            height: 140px;
            border: 4px dashed #e91e63;
            border-radius: 16px;
            background: rgba(233, 30, 99, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #c2185b;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .scanner-zone.drag-over {
            background: rgba(233, 30, 99, 0.2);
            transform: scale(1.05);
            border-style: solid;
        }

        /* STAGE 2: Quick Choice */
        .s2-options {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            justify-content: center;
            padding: 10px 40px;
        }

        .option-btn {
            background: white;
            border: 3px solid #42a5f5;
            border-radius: 16px;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #1565c0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            transition: all 0.2s;
        }

        .option-btn:hover, .option-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(66, 165, 245, 0.3);
            background: #e3f2fd;
        }

        .option-btn.star {
            border-color: #ff9800;
            background: #fffde7;
            color: #e65100;
        }

        /* Feedback Popups / Modals */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal-card {
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 450px;
            width: 85%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid #ff4081;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 28px;
            color: #d81b60;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .modal-msg {
            font-size: 20px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-next {
            background: linear-gradient(135deg, #4caf50, #388e3c);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
            transition: all 0.2s;
        }

        .btn-next:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #66bb6a, #43a047);
        }

        .btn-submit {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            color: white;
            border: none;
            padding: 14px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(171, 71, 188, 0.3);
        }

        /* Success Effect Sound visual cue */
        .beep-anim {
            animation: flash 0.4s ease-out;
        }

        @keyframes flash {
            0% { background-color: rgba(255, 235, 59, 0.8); }
            100% { background-color: transparent; }
        }
        .s1-area { min-height: 310px; gap: 28px; }
        .barcode-item { transition: none; }
        #order-slots { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
        .order-slot { padding:12px 8px; border:2px dashed #c6b2cf; border-radius:12px; text-align:center; color:#74677b; font-size:16px; }
        .order-slot b { display:block; margin-bottom:6px; }
        .order-slot.filled { border-style:solid; border-color:#66bb6a; background:#edf8ee; color:#216526; }
        #sortable-list { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:0; }
        .sort-card { cursor:pointer; touch-action:manipulation; text-align:left; gap:10px; min-height:64px; font-size:19px; }
        .sort-card span { font-size:14px; white-space:nowrap; }
        .sort-card:disabled { opacity:.5; cursor:default; background:#eee; }
        .order-actions { display:flex; gap:10px; }
        .order-actions button { flex:1; padding:10px; font-size:17px; border:2px solid #ab47bc; border-radius:10px; background:white; color:#6a1b9a; cursor:pointer; }
        button:disabled { opacity:.5; cursor:default; }
        button:focus-visible, .barcode-item:focus-visible { outline:4px solid #ff9800; outline-offset:3px; }
        @media(max-width:600px) {
            header { padding:12px 10px; } header h1 { font-size:20px; }
            .step-dot { width:28px; height:28px; } .step-indicator { gap:6px; }
            .stage { padding:12px; } .lanmei-dialogue { padding:10px; gap:8px; margin-bottom:12px; }
            .lanmei-avatar { width:60px; height:60px; } .dialogue-text { font-size:17px; }
            .scenario-box { padding:10px; font-size:16px; margin-bottom:12px; }
            #order-slots { grid-template-columns:repeat(2,1fr); }
            #sortable-list { grid-template-columns:1fr; } .sort-card { font-size:18px; padding:12px; }
            .s2-options { padding:0; } .option-btn { font-size:19px; }
        }

    </style>
</head>

            <div class="dialogue-text">
                第 2 關！最後一關，反應力大挑戰！<br>
                <strong>看到結帳，第一時間該怎麼做呢？</strong>
            </div>
        </div>

        <div class="scenario-box">
            🏪 情境：便利商店 ｜ 你買了一份早餐，消費金額為 125元，發票要存載具嗎？
        </div>

        <div class="s2-options">
            <button class="option-btn" onclick="checkStage2(false)">
                <span>🧾 我要紙本發票</span>
            </button>
            <button class="option-btn star" onclick="checkStage2(true)">
                <span>📱 我要刷手機條碼 ⭐</span>
            </button>
            <button class="option-btn" onclick="checkStage2(false)">
                <span>❌ 不需要發票</span>
            </button>
        </div>
    </div>

    <!-- Modal for Feedback & Completion -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="modal-title">🔔 嗶！掃描成功！</div>
            <div class="modal-msg" id="modal-msg">發票已存入雲端 ☁️</div>
            <button class="btn-next" id="modal-btn" onclick="nextStage()">下一關 ➔</button>
        </div>
    </div>
</div>

<script>
    let currentStage = 1;

    // --- Audio Sound Synthesizer for Arcade Beep ---
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } catch(e) {}
    }

    function playSuccessSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                gain.gain.setValueAtTime(0.1, now + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * 0.1);
                osc.stop(now + idx * 0.1 + 0.25);
            });
        } catch(e) {}
    }

    // Modal Helper
    function showModal(title, msg, btnText, callback) {
        document.getElementById('modal-title').innerHTML = title;
        document.getElementById('modal-msg').innerHTML = msg;
        const btn = document.getElementById('modal-btn');
        btn.innerHTML = btnText;
        btn.onclick = () => {
            document.getElementById('modal-overlay').style.display = 'none';
            if(callback) callback();
        };
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    // --- Stage 1 Logic (Drag & Touch Support) ---
    const barcode = document.getElementById('draggable-barcode');
    const dropzone = document.getElementById('scanner-dropzone');

    let scanDone = false;
    let drag = null;
    function resetBarcode() {
        barcode.style.transform = '';
        dropzone.classList.remove('drag-over');
        drag = null;
    }
    function overScanner() {
        const a = barcode.getBoundingClientRect(), b = dropzone.getBoundingClientRect();
        const x = a.left + a.width / 2, y = a.top + a.height / 2;
        return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
    }
    barcode.addEventListener('pointerdown', e => {
        if (scanDone || e.button !== 0) return;
        drag = {x:e.clientX, y:e.clientY};
        barcode.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    barcode.addEventListener('pointermove', e => {
        if (!drag) return;
        barcode.style.transform = `translate(${e.clientX-drag.x}px, ${e.clientY-drag.y}px)`;
        dropzone.classList.toggle('drag-over', overScanner() && e.clientY < drag.y);
    });
    barcode.addEventListener('pointerup', e => {
        if (!drag) return;
        const success = e.clientY < drag.y - 20 && overScanner();
        resetBarcode();
        if (success) triggerStage1Success();
    });
    barcode.addEventListener('pointercancel', resetBarcode);
    barcode.addEventListener('lostpointercapture', resetBarcode);
    barcode.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); triggerStage1Success(); }
    });

    function triggerStage1Success() {
        if (scanDone) return;
        scanDone = true;
        playBeep();
        document.body.classList.add('beep-anim');
        setTimeout(() => document.body.classList.remove('beep-anim'), 400);

        showModal("🔔 嗶！掃描成功！", "發票已存入雲端 ☁️<br><br><i>「真棒！拿手機給店員刷就是這麼簡單！」</i>", "進行第 2 關 ➔", () => {
            goToStage(2);
        });
    }

    // --- Stage 2 Logic ---
    function checkStage2(isCorrect) {
        if(isCorrect) {
            playSuccessSound();
            showModal("🎉 恭喜通關！消費結帳王！", "兩關挑戰完成！<br><br>消費結帳時記得<strong>主動出示手機條碼</strong>！<br>☁️ 發票存雲端，方便又環保！", "再玩一次 🔄", () => {
                location.reload();
            });
        } else {
            showModal("💡 再想想看喔！", "主動出示手機條碼可以將發票存入雲端，方便又環保！", "再試一次", null);
        }
    }

    // Stage Switcher
    function goToStage(stageNum) {
        currentStage = stageNum;
        document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
        document.getElementById(`stage-${stageNum}`).classList.add('active');

        document.querySelectorAll('.step-dot').forEach((dot, idx) => {
            if (idx + 1 <= stageNum) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        });
    }
</script>
